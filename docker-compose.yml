services:
  mysql:
    image: mysql:8.4
    container_name: ferreteria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ferreteria}
      MYSQL_USER: ${MYSQL_USER:-ferreteria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ferreteria123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
