# Perfil alternativo SOLO para desarrollo sin MySQL.
# Activar con: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ferreteria;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=true
