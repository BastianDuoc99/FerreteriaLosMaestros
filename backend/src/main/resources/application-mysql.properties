# Perfil MySQL explícito. La configuración base ya apunta a MySQL 8;
# este perfil existe para que la intención sea evidente en la entrega.
# Activar con: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.h2.console.enabled=false
