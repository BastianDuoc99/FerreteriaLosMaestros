spring.application.name=ferreteria-los-maestros-backend
server.port=${PORT:8080}

# Base de datos exigida por la rubrica EP3: MySQL 8.
# Para ejecutar sin MySQL usar el perfil "local" (H2 en archivo):
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ferreteria?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USER:ferreteria}
spring.datasource.password=${DB_PASSWORD:ferreteria123}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:cambiar-este-valor-en-entrega-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc.swagger-ui.path=/swagger-ui.html
